onboarding = false
[ui]
prompt_new_tab_name = false
agent_panel_sort = "priority"
[ui.toast]
delivery = "system"

# Navigation sent by Karabiner while Warp is frontmost.
[keys]
previous_tab = ["prefix+p", "alt+shift+i"]
next_tab = ["prefix+n", "alt+shift+o"]
previous_workspace = "alt+shift+u"
next_workspace = "alt+shift+y"
last_pane = "alt+shift+n"
